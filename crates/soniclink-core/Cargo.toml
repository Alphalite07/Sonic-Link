[package]
name = "soniclink-core"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
chacha20 = "0.9"
chacha20poly1305 = "0.10"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
hkdf = "0.12"
rand = "0.8"
reedsolomon = "0.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }