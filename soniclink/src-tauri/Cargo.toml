[package]
name = "soniclink"
version = "0.1.0"
description = "SonicLink Encrypted Acoustic Modem"
authors = ["you"]
edition = "2021"

[lib]
name = "soniclink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rand = "0.8"
hex = "0.4"
soniclink-core = { path = "../crates/soniclink-core" }
